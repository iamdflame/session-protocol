<!doctype html>
<html lang="en" data-session="night" style="background:#080A0D">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="/mark.svg" type="image/svg+xml" />

    <title>SESSION — separate the day from the night</title>
    <meta name="description" content="Tokenized equities trade around the clock; the stock behind them trades for six and a half hours. SESSION separates regular-session exposure (X.DAY) from overnight gap exposure (X.NIGHT)." />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="SESSION — separate the day from the night" />
    <meta property="og:description" content="Intraday exposure and overnight gap risk, separated into two tokens that hand the stock to each other at every bell." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#080A0D" />
    <meta name="color-scheme" content="dark" />

    <!-- Self-hosted (src/styles/fonts.css): same origin, fetched in parallel with the app. -->
    <link rel="preload" href="/fonts/geist-latin-v5.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/geist-mono-latin-v6.woff2" as="font" type="font/woff2" crossorigin />

    <!--
      The ground, before first paint.

      A page whose whole subject is what is true right now must not flash the
      wrong answer on the way in. This script is generated from the same
      calendar the program uses and verified against it across 313,117
      timestamps; see scripts/gen-ground.ts. React only ever corrects it.
    -->
    <script>/*__GROUND__*/</script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width:34rem;margin:14vh auto;padding:0 1.5rem;font:400 15px/1.6 Geist,system-ui,sans-serif;color:#F3F5F7">
        <p style="font:600 12px/1 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#9AA3AE">SESSION</p>
        <p style="margin-top:1rem">
          SESSION reads the live session clock, live quotes and on-chain vault
          state as you watch, so it needs JavaScript. It separates tokenized
          equity exposure into two classes: X.DAY for the regular session and
          X.NIGHT for the hours the market is shut.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
