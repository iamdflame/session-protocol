[package]
name = "session-core"
version = "0.1.0"
edition = "2021"
description = "The pure arithmetic every SESSION program settles on: the NYSE calendar and 256-bit fixed point"
license = "MIT"

[lib]
name = "session_core"

# No dependencies, on purpose. This crate decides when a bell rings and how a
# price is scaled, for every program that links it; nothing it pulls in may be
# able to change either answer underneath a deployed program.
[dependencies]

[dev-dependencies]
proptest = "1"
serde_json = "1"
